<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diep.io Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #cdcdcd;
            font-family: 'Ubuntu', sans-serif;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            font-size: 20px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        #level-bar-container {
            width: 300px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 auto;
        }

        #level-bar {
            height: 100%;
            background: #f7c948;
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }

        #level-text {
            font-size: 14px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            margin-top: 3px;
        }

        #minimap {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(200, 200, 200, 0.7);
            border: 2px solid rgba(0,0,0,0.3);
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        #game-over h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #game-over p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        #game-over button {
            padding: 12px 30px;
            font-size: 18px;
            background: #4fc3f7;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            pointer-events: all;
        }

        #game-over button:hover {
            background: #29b6f6;
        }

        #controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #555;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="level-bar-container">
            <div id="level-bar"></div>
        </div>
        <div id="level-text">Level 1</div>
    </div>

    <canvas id="minimap"></canvas>

    <div id="game-over">
        <h1>Game Over!</h1>
        <p id="final-score">Score: 0</p>
        <button onclick="restartGame()">Choi Lai</button>
    </div>

    <div id="controls-info">
        WASD: Di chuyen | Chuot: Ngam & Ban | Auto-fire: ON
    </div>

    <script src="game.js"></script>
</body>
</html>
