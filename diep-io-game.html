<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diep.io Clone</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Ubuntu', sans-serif; }
canvas { display: block; }

#start-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(205, 205, 205, 0.95); z-index: 100;
}
#start-screen h1 {
  font-size: 72px; color: #4a4a4a; margin-bottom: 20px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}
#start-screen input {
  width: 300px; padding: 12px 20px; font-size: 18px;
  border: 2px solid #888; border-radius: 4px; text-align: center;
  outline: none; margin-bottom: 15px;
}
#start-screen input:focus { border-color: #5a5; }
#start-screen button {
  padding: 12px 40px; font-size: 20px; cursor: pointer;
  background: #5a5; color: white; border: none; border-radius: 4px;
  transition: background 0.2s;
}
#start-screen button:hover { background: #4a4; }

#death-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.7); z-index: 100;
}
#death-screen h2 { font-size: 48px; color: #e55; margin-bottom: 10px; }
#death-screen p { font-size: 24px; color: #fff; margin-bottom: 20px; }
#death-screen button {
  padding: 12px 40px; font-size: 20px; cursor: pointer;
  background: #5a5; color: white; border: none; border-radius: 4px;
}

#upgrade-panel {
  position: fixed; left: 15px; top: 50%; transform: translateY(-50%);
  z-index: 50; display: none;
}
.upgrade-row {
  display: flex; align-items: center; margin: 3px 0; cursor: pointer;
  background: rgba(0,0,0,0.5); border-radius: 4px; padding: 3px 8px;
  transition: background 0.15s;
}
.upgrade-row:hover { background: rgba(0,0,0,0.7); }
.upgrade-key {
  width: 22px; height: 22px; background: #555; color: #fff;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; font-size: 11px; font-weight: bold; margin-right: 6px;
}
.upgrade-name { color: #fff; font-size: 13px; width: 110px; }
.upgrade-bars { display: flex; gap: 2px; }
.upgrade-bar {
  width: 14px; height: 14px; border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.3);
}
.upgrade-bar.filled { background: #5a5; }
.upgrade-bar.empty { background: rgba(255,255,255,0.15); }

#class-panel {
  position: fixed; right: 15px; top: 50%; transform: translateY(-50%);
  z-index: 50; display: none;
}
.class-btn {
  display: block; width: 70px; height: 70px; margin: 5px;
  border: 2px solid rgba(255,255,255,0.5); border-radius: 8px;
  background: rgba(0,0,0,0.5); cursor: pointer; position: relative;
  transition: all 0.2s;
}
.class-btn:hover { background: rgba(0,0,0,0.8); border-color: #5a5; }
.class-btn canvas { width: 100%; height: 100%; }
.class-label {
  position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 9px; white-space: nowrap; text-shadow: 1px 1px 2px #000;
}

#hud-level {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  z-index: 50; text-align: center;
}
#level-text { color: #fff; font-size: 16px; text-shadow: 1px 1px 2px #000; }
#xp-bar-outer {
  width: 300px; height: 18px; background: rgba(0,0,0,0.5);
  border-radius: 9px; overflow: hidden; margin-top: 4px;
}
#xp-bar-inner {
  height: 100%; background: #fc0; border-radius: 9px;
  transition: width 0.2s;
}

#score-display {
  position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 14px; z-index: 50; text-shadow: 1px 1px 2px #000;
}

#points-display {
  position: fixed; top: 15px; left: 15px;
  color: #fc0; font-size: 18px; font-weight: bold; z-index: 50;
  text-shadow: 1px 1px 2px #000; display: none;
}

#class-name-display {
  position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.6); font-size: 13px; z-index: 50;
}

</style>
</head>
<body>

<div id="start-screen">
  <h1>Diep.io</h1>
  <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="15" />
  <button onclick="startGame()">Chơi!</button>
</div>

<div id="death-screen">
  <h2>Bạn đã bị tiêu diệt!</h2>
  <p id="death-score"></p>
  <p id="death-killer"></p>
  <button onclick="respawn()">Chơi lại</button>
</div>

<canvas id="game"></canvas>

<div id="upgrade-panel"></div>
<div id="class-panel"></div>

<div id="hud-level">
  <div id="level-text">Level 1 Tank</div>
  <div id="xp-bar-outer"><div id="xp-bar-inner" style="width:0%"></div></div>
</div>
<div id="score-display">Score: 0</div>
<div id="points-display"></div>
<div id="class-name-display"></div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const WORLD_W = 6000;
const WORLD_H = 6000;
const GRID_SIZE = 24;
const MAX_LEVEL = 45;
const MAX_STAT = 7;
const STAT_NAMES = [
  'Health Regen', 'Max Health', 'Body Damage', 'Bullet Speed',
  'Bullet Penetration', 'Bullet Damage', 'Reload', 'Movement Speed'
];
const STAT_KEYS = ['1','2','3','4','5','6','7','8'];
const STAT_COLORS = [
  '#e68a8a','#a855a8','#8585cc','#5bc0de',
  '#5bc0de','#e6a532','#d94040','#66bb66'
];

const XP_TABLE = [];
{ let x = 4; for(let i = 0; i <= MAX_LEVEL; i++) { XP_TABLE[i] = x; x = Math.floor(x * 1.1 + 2); } }

const SHAPE_TYPES = {
  square:   { sides: 4, size: 14, hp: 10,  xp: 10,  color: '#ffe869', borderColor: '#b8a430', bodyDmg: 8 },
  triangle: { sides: 3, size: 16, hp: 30,  xp: 25,  color: '#fc7677', borderColor: '#b84040', bodyDmg: 12 },
  pentagon: { sides: 5, size: 24, hp: 100, xp: 130, color: '#768dfc', borderColor: '#4050b0', bodyDmg: 16 },
  alphaPentagon: { sides: 5, size: 70, hp: 3000, xp: 3000, color: '#768dfc', borderColor: '#4050b0', bodyDmg: 40 }
};

// Tank class definitions
const TANK_CLASSES = {
  basic: {
    name: 'Basic', level: 0, parent: null,
    barrels: [{ angle: 0, width: 0.65, length: 1.0, reload: 1.0, bulletSpeed: 1.0, bulletSize: 1.0, bulletDmg: 1.0, offset: 0 }]
  },
  twin: {
    name: 'Twin', level: 15, parent: 'basic',
    barrels: [
      { angle: 0, width: 0.5, length: 0.95, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.85, bulletDmg: 0.85, offset: -0.4 },
      { angle: 0, width: 0.5, length: 0.95, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.85, bulletDmg: 0.85, offset: 0.4 }
    ]
  },
  sniper: {
    name: 'Sniper', level: 15, parent: 'basic',
    barrels: [{ angle: 0, width: 0.55, length: 1.4, reload: 1.6, bulletSpeed: 1.5, bulletSize: 0.9, bulletDmg: 1.5, offset: 0 }]
  },
  machineGun: {
    name: 'Machine Gun', level: 15, parent: 'basic',
    barrels: [{ angle: 0, width: 0.85, length: 0.9, reload: 0.6, bulletSpeed: 0.9, bulletSize: 0.8, bulletDmg: 0.7, offset: 0, spread: 0.2 }]
  },
  flankGuard: {
    name: 'Flank Guard', level: 15, parent: 'basic',
    barrels: [
      { angle: 0, width: 0.6, length: 0.95, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.9, bulletDmg: 1.0, offset: 0 },
      { angle: Math.PI, width: 0.6, length: 0.85, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.8, bulletDmg: 0.8, offset: 0 }
    ]
  },
  tripleShot: {
    name: 'Triple Shot', level: 30, parent: 'twin',
    barrels: [
      { angle: -0.35, width: 0.5, length: 0.92, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.8, bulletDmg: 0.8, offset: 0 },
      { angle: 0, width: 0.5, length: 1.0, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.85, bulletDmg: 0.85, offset: 0 },
      { angle: 0.35, width: 0.5, length: 0.92, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.8, bulletDmg: 0.8, offset: 0 }
    ]
  },
  assassin: {
    name: 'Assassin', level: 30, parent: 'sniper',
    barrels: [{ angle: 0, width: 0.52, length: 1.7, reload: 2.0, bulletSpeed: 1.8, bulletSize: 0.85, bulletDmg: 2.0, offset: 0 }]
  },
  destroyer: {
    name: 'Destroyer', level: 30, parent: 'machineGun',
    barrels: [{ angle: 0, width: 1.0, length: 0.85, reload: 3.0, bulletSpeed: 0.7, bulletSize: 1.8, bulletDmg: 3.5, offset: 0 }]
  },
  triAngle: {
    name: 'Tri-Angle', level: 30, parent: 'flankGuard',
    barrels: [
      { angle: 0, width: 0.6, length: 1.0, reload: 1.0, bulletSpeed: 1.0, bulletSize: 0.9, bulletDmg: 1.0, offset: 0 },
      { angle: Math.PI - 0.3, width: 0.45, length: 0.75, reload: 0.8, bulletSpeed: 0.8, bulletSize: 0.7, bulletDmg: 0.5, offset: 0 },
      { angle: Math.PI + 0.3, width: 0.45, length: 0.75, reload: 0.8, bulletSpeed: 0.8, bulletSize: 0.7, bulletDmg: 0.5, offset: 0 }
    ]
  }
};

// ============================================================
// GAME STATE
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let gameRunning = false;
let player = null;
let entities = [];  // shapes
let bullets = [];
let bots = [];
let particles = [];
let camera = { x: 0, y: 0, zoom: 1 };
let mouse = { x: 0, y: 0 };
let keys = {};
let lastTime = 0;
let spawnTimer = 0;
let botSpawnTimer = 0;

// ============================================================
// UTILITY
// ============================================================
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return Math.random() * (b - a) + a; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function worldToScreen(wx, wy) {
  return {
    x: (wx - camera.x) * camera.zoom + canvas.width / 2,
    y: (wy - camera.y) * camera.zoom + canvas.height / 2
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - canvas.width / 2) / camera.zoom + camera.x,
    y: (sy - canvas.height / 2) / camera.zoom + camera.y
  };
}

// ============================================================
// ENTITY: Tank
// ============================================================
function createTank(x, y, name, isPlayer, tankClass) {
  tankClass = tankClass || 'basic';
  const cls = TANK_CLASSES[tankClass];
  return {
    x, y, vx: 0, vy: 0,
    radius: 25,
    angle: 0,
    name: name || '',
    isPlayer,
    tankClass,
    barrels: JSON.parse(JSON.stringify(cls.barrels)),
    hp: 80, maxHp: 80,
    level: 1,
    xp: 0,
    score: 0,
    stats: [0, 0, 0, 0, 0, 0, 0, 0],
    statPoints: 0,
    reloadTimers: cls.barrels.map(() => 0),
    invulnTimer: 0,
    color: isPlayer ? '#00b2e1' : null,
    alive: true,
    autoFire: false,
    // Bot AI
    aiTarget: null,
    aiTimer: 0,
    aiWanderAngle: Math.random() * Math.PI * 2,
    killedBy: ''
  };
}

function getStatValue(tank, statIndex) {
  return tank.stats[statIndex];
}

function getMaxHp(tank) { return 80 + getStatValue(tank, 1) * 20; }
function getBodyDmg(tank) { return 8 + getStatValue(tank, 2) * 5; }
function getBulletSpeed(tank) { return 5 + getStatValue(tank, 3) * 1.2; }
function getBulletPen(tank) { return 5 + getStatValue(tank, 4) * 4; }
function getBulletDmg(tank) { return 7 + getStatValue(tank, 5) * 4; }
function getReloadRate(tank) { return 1.0 - getStatValue(tank, 6) * 0.08; }
function getMoveSpeed(tank) { return 2.5 + getStatValue(tank, 7) * 0.4; }
function getHealthRegen(tank) { return 0.1 + getStatValue(tank, 0) * 0.5; }

function getPointsForLevel(level) {
  if (level <= 1) return 0;
  // 1 stat point per level up to level 28, then every other level
  let pts = 0;
  for (let i = 2; i <= level; i++) {
    if (i <= 28 || i % 2 === 0) pts++;
  }
  return pts;
}

function getAvailableClasses(tank) {
  const result = [];
  for (const [key, cls] of Object.entries(TANK_CLASSES)) {
    if (cls.parent === tank.tankClass && tank.level >= cls.level) {
      result.push(key);
    }
  }
  return result;
}

function upgradeTankClass(tank, newClass) {
  const cls = TANK_CLASSES[newClass];
  if (!cls) return;
  tank.tankClass = newClass;
  tank.barrels = JSON.parse(JSON.stringify(cls.barrels));
  tank.reloadTimers = cls.barrels.map(() => 0);
}

function levelUp(tank) {
  if (tank.level >= MAX_LEVEL) return;
  tank.level++;
  tank.maxHp = getMaxHp(tank);
  tank.hp = tank.maxHp;
  const totalPoints = getPointsForLevel(tank.level);
  const usedPoints = tank.stats.reduce((a, b) => a + b, 0);
  tank.statPoints = totalPoints - usedPoints;
}

function addXp(tank, amount) {
  tank.xp += amount;
  tank.score += amount;
  while (tank.level < MAX_LEVEL && tank.xp >= XP_TABLE[tank.level]) {
    tank.xp -= XP_TABLE[tank.level];
    levelUp(tank);
  }
  if (tank.level >= MAX_LEVEL) tank.xp = 0;
}

// ============================================================
// ENTITY: Bullet
// ============================================================
function createBullet(owner, barrelIndex) {
  const barrel = owner.barrels[barrelIndex];
  const angle = owner.angle + barrel.angle;
  const speed = getBulletSpeed(owner) * barrel.bulletSpeed;
  const size = 10 * barrel.bulletSize;
  const spread = barrel.spread ? (Math.random() - 0.5) * barrel.spread : 0;
  const finalAngle = angle + spread;

  const offsetX = Math.cos(angle + Math.PI / 2) * barrel.offset * owner.radius;
  const offsetY = Math.sin(angle + Math.PI / 2) * barrel.offset * owner.radius;
  const spawnDist = owner.radius + barrel.length * owner.radius * 0.6;

  return {
    x: owner.x + Math.cos(angle) * spawnDist + offsetX,
    y: owner.y + Math.sin(angle) * spawnDist + offsetY,
    vx: Math.cos(finalAngle) * speed + owner.vx * 0.3,
    vy: Math.sin(finalAngle) * speed + owner.vy * 0.3,
    radius: size,
    hp: getBulletPen(owner) * barrel.bulletDmg,
    damage: getBulletDmg(owner) * barrel.bulletDmg,
    owner,
    life: 2.5,
    color: owner.isPlayer ? '#00b2e1' : (owner.color || '#f14e54'),
    borderColor: owner.isPlayer ? '#0077a3' : '#a03030'
  };
}

// ============================================================
// ENTITY: Shape
// ============================================================
function createShape(type, x, y) {
  const def = SHAPE_TYPES[type];
  return {
    type, x, y,
    vx: 0, vy: 0,
    angle: Math.random() * Math.PI * 2,
    angularVel: (Math.random() - 0.5) * 0.02,
    radius: def.size,
    hp: def.hp, maxHp: def.hp,
    xp: def.xp,
    color: def.color,
    borderColor: def.borderColor,
    sides: def.sides,
    bodyDmg: def.bodyDmg,
    alive: true
  };
}

// ============================================================
// PARTICLE
// ============================================================
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = rand(1, 4);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(0.3, 0.8),
      maxLife: 0.8,
      radius: rand(3, 8),
      color
    });
  }
}

// ============================================================
// SPAWNING
// ============================================================
function spawnShapes(count) {
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let type;
    if (r < 0.6) type = 'square';
    else if (r < 0.85) type = 'triangle';
    else if (r < 0.998) type = 'pentagon';
    else type = 'alphaPentagon';

    const padding = 100;
    const x = rand(padding, WORLD_W - padding);
    const y = rand(padding, WORLD_H - padding);
    entities.push(createShape(type, x, y));
  }
}

function spawnBot() {
  const names = ['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel',
    'India','Juliet','Kilo','Lima','Mike','November','Oscar','Papa',
    'Quebec','Romeo','Sierra','Tango','Uniform','Victor','Whiskey','Zulu',
    'Tank01','Tank02','Pro','Noob','Shadow','Storm','Blaze','Viper'];
  const name = names[Math.floor(Math.random() * names.length)];
  const padding = 200;
  const x = rand(padding, WORLD_W - padding);
  const y = rand(padding, WORLD_H - padding);
  const bot = createTank(x, y, name, false, 'basic');
  // random color
  const colors = ['#f14e54','#bf7ff5','#ff7f50','#6fcc6f','#ffa500','#ff69b4','#e6a532'];
  bot.color = colors[Math.floor(Math.random() * colors.length)];
  // give bots some starting level based on player level
  const pLevel = player ? player.level : 1;
  const targetLevel = Math.max(1, Math.floor(rand(Math.max(1, pLevel - 5), Math.max(pLevel, 3))));
  for (let i = 1; i < targetLevel; i++) {
    addXp(bot, XP_TABLE[bot.level] || 999);
  }
  // distribute stat points randomly
  while (bot.statPoints > 0) {
    const idx = Math.floor(Math.random() * 8);
    if (bot.stats[idx] < MAX_STAT) {
      bot.stats[idx]++;
      bot.statPoints--;
      bot.maxHp = getMaxHp(bot);
      bot.hp = bot.maxHp;
    }
  }
  // maybe upgrade class
  if (bot.level >= 15) {
    const classes15 = ['twin','sniper','machineGun','flankGuard'];
    upgradeTankClass(bot, classes15[Math.floor(Math.random() * classes15.length)]);
  }
  if (bot.level >= 30) {
    const avail = getAvailableClasses(bot);
    if (avail.length > 0) {
      upgradeTankClass(bot, avail[Math.floor(Math.random() * avail.length)]);
    }
  }
  bots.push(bot);
}

// ============================================================
// UPDATE
// ============================================================
function updateTank(tank, dt) {
  if (!tank.alive) return;

  tank.maxHp = getMaxHp(tank);

  // Regen
  tank.hp = Math.min(tank.maxHp, tank.hp + getHealthRegen(tank) * dt);

  // Invulnerability
  if (tank.invulnTimer > 0) tank.invulnTimer -= dt;

  // Movement
  const speed = getMoveSpeed(tank);
  if (tank.isPlayer) {
    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (mx || my) {
      const len = Math.hypot(mx, my);
      mx /= len; my /= len;
    }
    tank.vx = lerp(tank.vx, mx * speed, 0.15);
    tank.vy = lerp(tank.vy, my * speed, 0.15);

    // Aiming
    const wm = screenToWorld(mouse.x, mouse.y);
    tank.angle = Math.atan2(wm.y - tank.y, wm.x - tank.x);
  }

  tank.x += tank.vx;
  tank.y += tank.vy;
  tank.vx *= 0.95;
  tank.vy *= 0.95;

  // Clamp to world
  tank.x = clamp(tank.x, tank.radius, WORLD_W - tank.radius);
  tank.y = clamp(tank.y, tank.radius, WORLD_H - tank.radius);

  // Shooting
  const isShooting = tank.isPlayer ? (keys['mousedown'] || tank.autoFire) : true;
  for (let i = 0; i < tank.barrels.length; i++) {
    tank.reloadTimers[i] -= dt;
    if (isShooting && tank.reloadTimers[i] <= 0) {
      const barrel = tank.barrels[i];
      const reloadTime = 0.5 * getReloadRate(tank) * (barrel.reload || 1.0);
      tank.reloadTimers[i] = reloadTime;
      bullets.push(createBullet(tank, i));
      // recoil
      const angle = tank.angle + barrel.angle;
      tank.vx -= Math.cos(angle) * 0.4;
      tank.vy -= Math.sin(angle) * 0.4;
    }
  }
}

function updateBotAI(bot, dt) {
  if (!bot.alive) return;

  bot.aiTimer -= dt;
  if (bot.aiTimer <= 0) {
    bot.aiTimer = rand(0.5, 2.0);
    // Find target
    let bestTarget = null;
    let bestDist = 800;

    // Check player
    if (player && player.alive) {
      const d = dist(bot, player);
      if (d < bestDist) { bestDist = d; bestTarget = player; }
    }

    // Check shapes
    for (const e of entities) {
      if (!e.alive) continue;
      const d = dist(bot, e);
      if (d < bestDist * 0.7) { bestDist = d; bestTarget = e; }
    }

    // Check other bots
    for (const other of bots) {
      if (other === bot || !other.alive) continue;
      const d = dist(bot, other);
      if (d < bestDist) { bestDist = d; bestTarget = other; }
    }

    bot.aiTarget = bestTarget;
    bot.aiWanderAngle += (Math.random() - 0.5) * 1.5;
  }

  const speed = getMoveSpeed(bot);
  if (bot.aiTarget && bot.aiTarget.alive !== false) {
    const target = bot.aiTarget;
    const dx = target.x - bot.x;
    const dy = target.y - bot.y;
    const d = Math.hypot(dx, dy);
    bot.angle = Math.atan2(dy, dx);

    // Move toward target but keep distance
    let desiredDist = 300;
    if (target.sides) desiredDist = 100; // shapes: get close
    if (target.isPlayer && target.level <= 5) desiredDist = 500; // give new players space
    if (d > desiredDist) {
      bot.vx = lerp(bot.vx, (dx / d) * speed, 0.1);
      bot.vy = lerp(bot.vy, (dy / d) * speed, 0.1);
    } else if (d < desiredDist * 0.5) {
      bot.vx = lerp(bot.vx, -(dx / d) * speed * 0.5, 0.1);
      bot.vy = lerp(bot.vy, -(dy / d) * speed * 0.5, 0.1);
    }
  } else {
    // Wander
    bot.vx = lerp(bot.vx, Math.cos(bot.aiWanderAngle) * speed * 0.5, 0.05);
    bot.vy = lerp(bot.vy, Math.sin(bot.aiWanderAngle) * speed * 0.5, 0.05);
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life -= dt;

    if (b.life <= 0 || b.x < -50 || b.x > WORLD_W + 50 || b.y < -50 || b.y > WORLD_H + 50 || b.hp <= 0) {
      bullets.splice(i, 1);
      continue;
    }

    // Hit shapes
    for (let j = entities.length - 1; j >= 0; j--) {
      const e = entities[j];
      if (!e.alive) continue;
      if (dist(b, e) < b.radius + e.radius) {
        e.hp -= b.damage;
        b.hp -= e.bodyDmg;
        // Knockback
        const angle = Math.atan2(e.y - b.y, e.x - b.x);
        e.vx += Math.cos(angle) * 2;
        e.vy += Math.sin(angle) * 2;

        if (e.hp <= 0) {
          e.alive = false;
          spawnParticles(e.x, e.y, e.color, 8);
          if (b.owner && b.owner.alive) {
            addXp(b.owner, e.xp);
          }
        }
        if (b.hp <= 0) { bullets.splice(i, 1); break; }
      }
    }

    if (i >= bullets.length) continue;
    const b2 = bullets[i];
    if (!b2) continue;

    // Hit tanks (player + bots)
    const allTanks = [player, ...bots].filter(t => t && t.alive);
    for (const tank of allTanks) {
      if (b2.owner === tank) continue;
      if (tank.invulnTimer > 0) continue;
      if (dist(b2, tank) < b2.radius + tank.radius) {
        tank.hp -= b2.damage;
        b2.hp -= 5;
        const angle = Math.atan2(tank.y - b2.y, tank.x - b2.x);
        tank.vx += Math.cos(angle) * 3;
        tank.vy += Math.sin(angle) * 3;

        if (tank.hp <= 0) {
          tank.alive = false;
          spawnParticles(tank.x, tank.y, tank.color || '#00b2e1', 20);
          if (b2.owner && b2.owner.alive) {
            addXp(b2.owner, Math.floor(tank.score * 0.3) + 20);
          }
          if (tank.isPlayer) {
            tank.killedBy = b2.owner ? b2.owner.name : 'Unknown';
          }
        }
        if (b2.hp <= 0) { bullets.splice(i, 1); break; }
      }
    }
  }
}

function updateShapes(dt) {
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    if (!e.alive) { entities.splice(i, 1); continue; }
    e.x += e.vx;
    e.y += e.vy;
    e.vx *= 0.98;
    e.vy *= 0.98;
    e.angle += e.angularVel;
    e.x = clamp(e.x, e.radius, WORLD_W - e.radius);
    e.y = clamp(e.y, e.radius, WORLD_H - e.radius);
  }

  // Body collision with tanks
  const allTanks = [player, ...bots].filter(t => t && t.alive);
  for (const tank of allTanks) {
    for (const e of entities) {
      if (!e.alive) continue;
      const d = dist(tank, e);
      if (d < tank.radius + e.radius) {
        // Push apart
        const angle = Math.atan2(e.y - tank.y, e.x - tank.x);
        const overlap = tank.radius + e.radius - d;
        e.x += Math.cos(angle) * overlap * 0.5;
        e.y += Math.sin(angle) * overlap * 0.5;
        tank.x -= Math.cos(angle) * overlap * 0.5;
        tank.y -= Math.sin(angle) * overlap * 0.5;

        // Damage
        if (tank.invulnTimer <= 0) {
          tank.hp -= e.bodyDmg * dt * 3;
          e.hp -= getBodyDmg(tank) * dt * 3;
          if (e.hp <= 0) {
            e.alive = false;
            spawnParticles(e.x, e.y, e.color, 8);
            addXp(tank, e.xp);
          }
          if (tank.hp <= 0) {
            tank.alive = false;
            spawnParticles(tank.x, tank.y, tank.color || '#00b2e1', 20);
            if (tank.isPlayer) tank.killedBy = 'a shape';
          }
        }
      }
    }
  }

  // Tank vs Tank collision
  for (let i = 0; i < allTanks.length; i++) {
    for (let j = i + 1; j < allTanks.length; j++) {
      const a = allTanks[i];
      const b = allTanks[j];
      if (!a.alive || !b.alive) continue;
      const d = dist(a, b);
      if (d < a.radius + b.radius) {
        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        const overlap = a.radius + b.radius - d;
        b.x += Math.cos(angle) * overlap * 0.5;
        b.y += Math.sin(angle) * overlap * 0.5;
        a.x -= Math.cos(angle) * overlap * 0.5;
        a.y -= Math.sin(angle) * overlap * 0.5;

        if (a.invulnTimer <= 0) a.hp -= getBodyDmg(b) * dt * 3;
        if (b.invulnTimer <= 0) b.hp -= getBodyDmg(a) * dt * 3;

        if (a.hp <= 0 && a.alive) {
          a.alive = false;
          spawnParticles(a.x, a.y, a.color || '#00b2e1', 20);
          if (b.alive) addXp(b, Math.floor(a.score * 0.3) + 20);
          if (a.isPlayer) a.killedBy = b.name;
        }
        if (b.hp <= 0 && b.alive) {
          b.alive = false;
          spawnParticles(b.x, b.y, b.color || '#00b2e1', 20);
          if (a.alive) addXp(a, Math.floor(b.score * 0.3) + 20);
          if (b.isPlayer) b.killedBy = a.name;
        }
      }
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ============================================================
// DRAW
// ============================================================
function drawGrid() {
  const gs = GRID_SIZE * camera.zoom;
  const offX = (-camera.x * camera.zoom + canvas.width / 2) % gs;
  const offY = (-camera.y * camera.zoom + canvas.height / 2) % gs;

  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = offX; x < canvas.width; x += gs) {
    ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
  }
  for (let y = offY; y < canvas.height; y += gs) {
    ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
  }
  ctx.stroke();
}

function drawWorldBorder() {
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4 * camera.zoom;
  const tl = worldToScreen(0, 0);
  const br = worldToScreen(WORLD_W, WORLD_H);
  ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

  // dim outside world
  ctx.fillStyle = 'rgba(180,180,180,0.4)';
  // Top
  ctx.fillRect(0, 0, canvas.width, tl.y);
  // Bottom
  ctx.fillRect(0, br.y, canvas.width, canvas.height - br.y);
  // Left
  ctx.fillRect(0, tl.y, tl.x, br.y - tl.y);
  // Right
  ctx.fillRect(br.x, tl.y, canvas.width - br.x, br.y - tl.y);
}

function drawPolygon(x, y, radius, sides, angle, fillColor, strokeColor, lineWidth) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = (Math.PI * 2 / sides) * i - Math.PI / 2;
    const px = Math.cos(a) * radius;
    const py = Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.lineWidth = lineWidth || 3;
  ctx.strokeStyle = strokeColor;
  ctx.stroke();
  ctx.restore();
}

function drawShape(shape) {
  const pos = worldToScreen(shape.x, shape.y);
  const r = shape.radius * camera.zoom;

  // Check if on screen
  if (pos.x < -r * 2 || pos.x > canvas.width + r * 2 ||
      pos.y < -r * 2 || pos.y > canvas.height + r * 2) return;

  drawPolygon(pos.x, pos.y, r, shape.sides, shape.angle, shape.color, shape.borderColor, 3 * camera.zoom);

  // Health bar
  if (shape.hp < shape.maxHp) {
    const barW = r * 2;
    const barH = 4 * camera.zoom;
    const barY = pos.y + r + 6 * camera.zoom;
    ctx.fillStyle = '#555';
    ctx.fillRect(pos.x - barW / 2, barY, barW, barH);
    ctx.fillStyle = '#5c5';
    ctx.fillRect(pos.x - barW / 2, barY, barW * (shape.hp / shape.maxHp), barH);
  }
}

function drawTank(tank) {
  if (!tank || !tank.alive) return;
  const pos = worldToScreen(tank.x, tank.y);
  const r = tank.radius * camera.zoom;

  if (pos.x < -r * 4 || pos.x > canvas.width + r * 4 ||
      pos.y < -r * 4 || pos.y > canvas.height + r * 4) return;

  const bodyColor = tank.color || '#00b2e1';
  const borderColor = tank.isPlayer ? '#0077a3' : darkenColor(bodyColor, 0.6);
  const barrelColor = '#999';
  const barrelBorder = '#727272';

  ctx.save();
  ctx.translate(pos.x, pos.y);

  // Draw barrels
  for (const barrel of tank.barrels) {
    ctx.save();
    ctx.rotate(tank.angle + barrel.angle);

    const bw = r * barrel.width;
    const bl = r * barrel.length * 1.3;
    const offset = barrel.offset * r;

    ctx.translate(0, offset);
    ctx.fillStyle = barrelColor;
    ctx.strokeStyle = barrelBorder;
    ctx.lineWidth = 2.5 * camera.zoom;
    ctx.beginPath();
    ctx.rect(0, -bw / 2, bl, bw);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Draw body circle
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = bodyColor;
  ctx.fill();
  ctx.lineWidth = 3 * camera.zoom;
  ctx.strokeStyle = borderColor;
  ctx.stroke();

  ctx.restore();

  // Name
  if (tank.name) {
    ctx.font = `bold ${14 * camera.zoom}px Ubuntu, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(tank.name, pos.x, pos.y - r - 16 * camera.zoom);
    ctx.fillText(tank.name, pos.x, pos.y - r - 16 * camera.zoom);
  }

  // Health bar
  const barW = r * 2.5;
  const barH = 5 * camera.zoom;
  const barY = pos.y + r + 8 * camera.zoom;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(pos.x - barW / 2, barY, barW, barH);
  const hpRatio = clamp(tank.hp / tank.maxHp, 0, 1);
  ctx.fillStyle = tank.isPlayer ? '#85e085' : '#e08585';
  ctx.fillRect(pos.x - barW / 2, barY, barW * hpRatio, barH);
}

function drawBullet(bullet) {
  const pos = worldToScreen(bullet.x, bullet.y);
  const r = bullet.radius * camera.zoom;
  if (pos.x < -r * 2 || pos.x > canvas.width + r * 2 ||
      pos.y < -r * 2 || pos.y > canvas.height + r * 2) return;

  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
  ctx.fillStyle = bullet.color;
  ctx.fill();
  ctx.lineWidth = 2.5 * camera.zoom;
  ctx.strokeStyle = bullet.borderColor;
  ctx.stroke();
}

function drawParticle(p) {
  const pos = worldToScreen(p.x, p.y);
  const alpha = p.life / p.maxLife;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, p.radius * camera.zoom, 0, Math.PI * 2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawMinimap() {
  const mw = 150, mh = 150;
  const mx = canvas.width - mw - 15;
  const my = canvas.height - mh - 15;
  const scale = mw / WORLD_W;

  ctx.fillStyle = 'rgba(205,205,205,0.7)';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.strokeRect(mx, my, mw, mh);

  // Shapes as tiny dots
  for (const e of entities) {
    if (!e.alive) continue;
    ctx.fillStyle = e.color;
    ctx.fillRect(mx + e.x * scale - 1, my + e.y * scale - 1, 2, 2);
  }

  // Bots
  for (const bot of bots) {
    if (!bot.alive) continue;
    ctx.fillStyle = bot.color || '#f14e54';
    ctx.beginPath();
    ctx.arc(mx + bot.x * scale, my + bot.y * scale, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player
  if (player && player.alive) {
    ctx.fillStyle = '#00b2e1';
    ctx.beginPath();
    ctx.arc(mx + player.x * scale, my + player.y * scale, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawLeaderboard() {
  const allTanks = [player, ...bots].filter(t => t && t.alive);
  allTanks.sort((a, b) => b.score - a.score);
  const top = allTanks.slice(0, 10);

  const lx = canvas.width - 180;
  const ly = 15;
  const lw = 165;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(lx, ly, lw, 25 + top.length * 22);
  ctx.font = 'bold 14px Ubuntu, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText('Leaderboard', lx + lw / 2, ly + 18);

  ctx.font = '12px Ubuntu, sans-serif';
  ctx.textAlign = 'left';
  for (let i = 0; i < top.length; i++) {
    const t = top[i];
    const yy = ly + 38 + i * 22;
    // Score bar
    const maxScore = top[0].score || 1;
    const barW = (lw - 10) * (t.score / maxScore);
    ctx.fillStyle = t.isPlayer ? 'rgba(0,178,225,0.5)' : 'rgba(241,78,84,0.3)';
    ctx.fillRect(lx + 5, yy - 12, barW, 18);
    ctx.fillStyle = t.isPlayer ? '#fff' : '#ddd';
    const displayName = t.name || 'Unnamed';
    ctx.fillText(`${displayName}`, lx + 10, yy);
  }
}

function darkenColor(hex, factor) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${Math.floor(r * factor)},${Math.floor(g * factor)},${Math.floor(b * factor)})`;
}

// ============================================================
// UI
// ============================================================
function updateUI() {
  if (!player) return;

  // Level + XP bar
  const className = TANK_CLASSES[player.tankClass]?.name || 'Tank';
  document.getElementById('level-text').textContent = `Level ${player.level} ${className}`;
  const xpPct = player.level >= MAX_LEVEL ? 100 : (player.xp / XP_TABLE[player.level] * 100);
  document.getElementById('xp-bar-inner').style.width = xpPct + '%';
  document.getElementById('score-display').textContent = `Score: ${player.score.toLocaleString()}`;
  document.getElementById('class-name-display').textContent = className;

  // Stat points
  const pointsEl = document.getElementById('points-display');
  if (player.statPoints > 0) {
    pointsEl.style.display = 'block';
    pointsEl.textContent = `x${player.statPoints} Stat Points Available`;
  } else {
    pointsEl.style.display = 'none';
  }

  // Upgrade panel
  const panel = document.getElementById('upgrade-panel');
  if (player.statPoints > 0) {
    panel.style.display = 'block';
    let html = '';
    for (let i = 0; i < 8; i++) {
      html += `<div class="upgrade-row" onclick="upgradeStat(${i})">
        <div class="upgrade-key" style="background:${STAT_COLORS[i]}">${STAT_KEYS[i]}</div>
        <div class="upgrade-name">${STAT_NAMES[i]}</div>
        <div class="upgrade-bars">`;
      for (let j = 0; j < MAX_STAT; j++) {
        html += `<div class="upgrade-bar ${j < player.stats[i] ? 'filled' : 'empty'}" style="${j < player.stats[i] ? 'background:' + STAT_COLORS[i] : ''}"></div>`;
      }
      html += '</div></div>';
    }
    panel.innerHTML = html;
  } else {
    panel.style.display = 'none';
  }

  // Class panel
  const classPanel = document.getElementById('class-panel');
  const availClasses = getAvailableClasses(player);
  if (availClasses.length > 0) {
    classPanel.style.display = 'block';
    classPanel.innerHTML = '';
    for (const cls of availClasses) {
      const btn = document.createElement('div');
      btn.className = 'class-btn';
      btn.onclick = () => {
        upgradeTankClass(player, cls);
        updateUI();
      };

      // Mini preview canvas
      const preview = document.createElement('canvas');
      preview.width = 60;
      preview.height = 60;
      drawTankPreview(preview, cls);
      btn.appendChild(preview);

      const label = document.createElement('div');
      label.className = 'class-label';
      label.textContent = TANK_CLASSES[cls].name;
      btn.appendChild(label);

      classPanel.appendChild(btn);
    }
  } else {
    classPanel.style.display = 'none';
  }

  // Death screen
  if (!player.alive) {
    document.getElementById('death-screen').style.display = 'flex';
    document.getElementById('death-score').textContent = `Score: ${player.score.toLocaleString()}`;
    document.getElementById('death-killer').textContent = `Bị hạ bởi: ${player.killedBy || 'Unknown'}`;
  }
}

function drawTankPreview(canvas, classKey) {
  const pctx = canvas.getContext('2d');
  const cx = 30, cy = 28, r = 15;
  const cls = TANK_CLASSES[classKey];

  pctx.clearRect(0, 0, 60, 60);

  // Barrels
  for (const barrel of cls.barrels) {
    pctx.save();
    pctx.translate(cx, cy);
    pctx.rotate(barrel.angle);
    const bw = r * barrel.width;
    const bl = r * barrel.length * 1.3;
    pctx.translate(0, barrel.offset * r);
    pctx.fillStyle = '#999';
    pctx.strokeStyle = '#727272';
    pctx.lineWidth = 2;
    pctx.fillRect(0, -bw / 2, bl, bw);
    pctx.strokeRect(0, -bw / 2, bl, bw);
    pctx.restore();
  }

  // Body
  pctx.beginPath();
  pctx.arc(cx, cy, r, 0, Math.PI * 2);
  pctx.fillStyle = '#00b2e1';
  pctx.fill();
  pctx.lineWidth = 2;
  pctx.strokeStyle = '#0077a3';
  pctx.stroke();
}

function upgradeStat(index) {
  if (!player || player.statPoints <= 0 || player.stats[index] >= MAX_STAT) return;
  player.stats[index]++;
  player.statPoints--;
  player.maxHp = getMaxHp(player);
  if (index === 1) player.hp = Math.min(player.hp + 20, player.maxHp);
  updateUI();
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!gameRunning) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Resize canvas
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Spawn shapes
  spawnTimer += dt;
  if (spawnTimer > 0.5 && entities.length < 350) {
    spawnTimer = 0;
    spawnShapes(3);
  }

  // Spawn bots
  botSpawnTimer += dt;
  if (botSpawnTimer > 5 && bots.length < 15) {
    botSpawnTimer = 0;
    spawnBot();
  }

  // Remove dead bots
  for (let i = bots.length - 1; i >= 0; i--) {
    if (!bots[i].alive) {
      bots.splice(i, 1);
    }
  }

  // Update
  if (player && player.alive) {
    updateTank(player, dt);
    camera.x = lerp(camera.x, player.x, 0.1);
    camera.y = lerp(camera.y, player.y, 0.1);
  }

  for (const bot of bots) {
    updateBotAI(bot, dt);
    updateTank(bot, dt);
  }

  updateBullets(dt);
  updateShapes(dt);
  updateParticles(dt);
  updateUI();

  // Draw
  ctx.fillStyle = '#cdcdcd';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid();
  drawWorldBorder();

  // Draw shapes
  for (const e of entities) {
    if (e.alive) drawShape(e);
  }

  // Draw bullets
  for (const b of bullets) drawBullet(b);

  // Draw particles
  for (const p of particles) drawParticle(p);

  // Draw bots
  for (const bot of bots) drawTank(bot);

  // Draw player
  drawTank(player);

  // Draw UI overlay
  drawMinimap();
  drawLeaderboard();

  // FPS counter (debug)
  ctx.font = '12px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.textAlign = 'left';
  ctx.fillText(`FPS: ${Math.round(1 / dt)} | Entities: ${entities.length} | Bots: ${bots.length} | Bullets: ${bullets.length}`, 10, canvas.height - 10);

  requestAnimationFrame(gameLoop);
}

// ============================================================
// CONTROLS
// ============================================================
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  keys[key] = true;

  // Stat upgrades
  if (player && player.alive) {
    const idx = STAT_KEYS.indexOf(key);
    if (idx !== -1) upgradeStat(idx);
    if (key === 'e') player.autoFire = !player.autoFire;
  }
});

document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

document.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

document.addEventListener('mousedown', e => {
  if (e.button === 0) keys['mousedown'] = true;
});

document.addEventListener('mouseup', e => {
  if (e.button === 0) keys['mousedown'] = false;
});

// Prevent right click
document.addEventListener('contextmenu', e => e.preventDefault());

// Enter to start
document.getElementById('player-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') startGame();
});

// ============================================================
// START / RESPAWN
// ============================================================
function startGame() {
  const nameInput = document.getElementById('player-name');
  const name = nameInput.value.trim() || 'Player';
  document.getElementById('start-screen').style.display = 'none';

  player = createTank(WORLD_W / 2, WORLD_H / 2, name, true);
  player.invulnTimer = 5;
  camera.x = player.x;
  camera.y = player.y;

  entities = [];
  bullets = [];
  bots = [];
  particles = [];

  spawnShapes(200);
  for (let i = 0; i < 5; i++) spawnBot();

  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function respawn() {
  document.getElementById('death-screen').style.display = 'none';
  const name = player.name;
  player = createTank(
    rand(200, WORLD_W - 200),
    rand(200, WORLD_H - 200),
    name, true
  );
  player.invulnTimer = 5;
  camera.x = player.x;
  camera.y = player.y;
  bullets = [];
}

// Focus name input
document.getElementById('player-name').focus();
</script>
</body>
</html>
